name: Verify Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run privacy:check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run lint
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validation-build
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 7
